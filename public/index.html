.d2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}.bars{display:flex;gap:4px;align-items:flex-end;height:110px}.bars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.bars i{display:block;width:100%;background:var(--ac);opacity:.75;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow .9s var(--e) both}.bars span{font-size:10px;color:var(--mu);height:12px}@keyframes grow{from{transform:scaleY(0)}to{transform:none}}

<script>
/* ===== platform layer: settings, offline storage (IndexedDB), images, backups, Claude API, Firebase sync ===== */
(function(){
const CK='sb_cfg',AK='sb_fbauth',UK='sb_upimg';
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const host=()=>{try{return typeof claude!=='undefined'&&claude&&typeof claude.use==='function'?claude:null}catch(e){return null}};
const PL=window.PL={err:'',stats:{total:0,active:0,drawn:0,ms:0}};
PL.cfg=Object.assign({claudeKey:'',model:'claude-sonnet-5-5',sim:'auto'},rd(CK,{}));
PL.cfg.fb=Object.assign({apiKey:'',projectId:'',email:'',password:''},PL.cfg.fb||{});
PL.cfg.bk=Object.assign({on:true,hours:6,keep:14},PL.cfg.bk||{});
PL.save=()=>wr(CK,PL.cfg);
PL.fbOn=()=>{const f=PL.cfg.fb;return !!(f.apiKey&&f.projectId&&f.email&&f.password)};
PL.mode=()=>PL.fbOn()?'firebase':host()?'artifact':'local';
PL.blobMode=()=>PL.mode()!=='artifact';

/* ---------- IndexedDB (falls back to memory when unavailable) ---------- */
const MEM={blobs:new Map(),backups:new Map()};PL.idbOk=false;
const dbp=new Promise(res=>{try{if(typeof indexedDB==='undefined')return res(null);const r=indexedDB.open('sb_store',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('blobs');d.createObjectStore('backups',{keyPath:'id'})};r.onsuccess=()=>{PL.idbOk=true;res(r.result)};r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
const idb=async(store,mode,fn)=>{const d=await dbp;if(!d)return null;return new Promise((res,rej)=>{try{const t=d.transaction(store,mode),s=t.objectStore(store);let out;const r=fn(s);if(r&&'onsuccess' in r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error||new Error('IndexedDB error'))}catch(e){rej(e)}})};
PL.putBlob=async(id,b)=>{MEM.blobs.set(id,b);try{await idb('blobs','readwrite',s=>s.put(b,id))}catch(e){PL.err='Storage is full or blocked — images may not persist'}};
PL.getBlob=async id=>{if(MEM.blobs.has(id))return MEM.blobs.get(id);try{const b=await idb('blobs','readonly',s=>s.get(id));if(b)MEM.blobs.set(id,b);return b||null}catch(e){return null}};
PL.delBlob=async id=>{MEM.blobs.delete(id);try{await idb('blobs','readwrite',s=>s.delete(id))}catch(e){}};
PL.blobKeys=async()=>{try{const k=await idb('blobs','readonly',s=>s.getAllKeys());if(k)return k}catch(e){}return[...MEM.blobs.keys()]};
PL.blobSizes=async()=>{let n=0,sz=0;try{const d=await dbp;if(d){await new Promise(res=>{const t=d.transaction('blobs','readonly'),c=t.objectStore('blobs').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){n++;sz+=cur.value&&cur.value.size||0;cur.continue()}else res()};c.onerror=()=>res()});return{n,size:sz}}}catch(e){}MEM.blobs.forEach(b=>{n++;sz+=b.size||0});return{n,size:sz}};

/* ---------- images ---------- */
const BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const OBJ={},LOAD={},MISS={};let imgT=0;
PL.img=x=>{if(typeof x!=='string'||x.slice(0,4)!=='idb:')return x;const id=x.slice(4);if(OBJ[id])return OBJ[id];
 if(!LOAD[id]||(MISS[id]&&Date.now()-MISS[id]>15000)){LOAD[id]=1;delete MISS[id];PL.loadImg(id).then(u=>{if(u){OBJ[id]=u;clearTimeout(imgT);imgT=setTimeout(()=>PL.onImg&&PL.onImg(id),40)}else MISS[id]=Date.now()})}
 return BLANK};
PL.loadImg=async id=>{let b=await PL.getBlob(id);if(!b&&PL.fbOn()&&navigator.onLine!==false){try{b=await FB.getImg(id);if(b)await PL.putBlob(id,b)}catch(e){}}return b?URL.createObjectURL(b):null};
PL.shrink=(file,max,q)=>new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image;i.onload=()=>{const k=Math.min(1,(max||1600)/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Could not encode that image')),'image/jpeg',q||.8)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read that image'))};i.src=u});
PL.hashBlob=async b=>{try{const h=await crypto.subtle.digest('SHA-256',await b.arrayBuffer());return[...new Uint8Array(h)].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,10)}};
PL.addImage=async file=>{let b=await PL.shrink(file,1600,.8);if(b.size>650000)b=await PL.shrink(file,1280,.65);const id=await PL.hashBlob(b);await PL.putBlob(id,b);OBJ[id]=URL.createObjectURL(b);return'idb:'+id};
PL.toDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
PL.fromDataUrl=async u=>{const i=u.indexOf(','),h=u.slice(5,i),bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:h.split(';')[0]||'image/jpeg'})};
PL.refsIn=notes=>{const s=new Set();Object.values(notes||{}).forEach(n=>(n.im||[]).forEach(x=>{if(typeof x==='string'&&x.slice(0,4)==='idb:')s.add(x.slice(4))}));return s};
PL.inlineData=async d=>{const ids=[...PL.refsIn(d.notes)],images={};for(const id of ids){const b=await PL.getBlob(id);if(b)images[id]=await PL.toDataUrl(b)}return images};
PL.ingestImages=async images=>{let c=0;for(const id of Object.keys(images||{})){try{if(!(await PL.getBlob(id))){await PL.putBlob(id,await PL.fromDataUrl(images[id]));c++}}catch(e){}}return c};

/* ---------- gzip helpers for backups ---------- */
const canZ=typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined'&&typeof Response!=='undefined';
const gz=async s=>canZ?await new Response(new Blob([s]).stream().pipeThrough(new CompressionStream('gzip'))).blob():s;
const gunz=async d=>typeof d==='string'?d:await new Response(d.stream().pipeThrough(new DecompressionStream('gzip'))).text();

/* ---------- backups ---------- */
PL.sig=()=>{const s=PL.getState&&PL.getState();if(!s)return'';let m=0,c=0;for(const k in s.notes){c++;const u=s.notes[k].up||0;if(u>m)m=u}return c+':'+m+':'+((s.meta&&s.meta.up)||0)};
PL.backup=async label=>{const s=PL.getState&&PL.getState();if(!s||!Object.keys(s.notes).length)return null;const json=JSON.stringify({app:'second-brain',v:2,at:Date.now(),notes:s.notes,meta:s.meta});
 const rec={id:Date.now(),at:Date.now(),label:label||'auto',n:Object.keys(s.notes).length,size:json.length,sig:PL.sig(),z:canZ?1:0,data:await gz(json)};
 MEM.backups.set(rec.id,rec);try{await idb('backups','readwrite',st=>st.put(rec))}catch(e){PL.err='Could not store the backup (storage full?)'}
 wr('sb_lastbk',{at:rec.at,sig:rec.sig});await PL.prune();return rec};
PL.listBackups=async()=>{let a=null;try{a=await idb('backups','readonly',s=>s.getAll())}catch(e){}if(!a)a=[...MEM.backups.values()];return a.map(r=>({id:r.id,at:r.at,label:r.label,n:r.n,size:r.size})).sort((x,y)=>y.at-x.at)};
PL.getBackup=async id=>{let r=MEM.backups.get(id);if(!r){try{r=await idb('backups','readonly',s=>s.get(id))}catch(e){}}if(!r)return null;return JSON.parse(await gunz(r.data))};
PL.delBackup=async id=>{MEM.backups.delete(id);try{await idb('backups','readwrite',s=>s.delete(id))}catch(e){}};
PL.prune=async()=>{const l=await PL.listBackups(),keep=Math.max(3,+PL.cfg.bk.keep||14);const man=l.filter(x=>x.label!=='auto');const aut=l.filter(x=>x.label==='auto');for(const r of aut.slice(keep))await PL.delBackup(r.id);for(const r of man.slice(keep*2))await PL.delBackup(r.id)};
PL.autoBackup=async force=>{if(!PL.cfg.bk.on&&!force)return null;const last=rd('sb_lastbk',null),sig=PL.sig();if(!sig)return null;if(!force&&last&&(last.sig===sig||Date.now()-last.at<(+PL.cfg.bk.hours||6)*3600e3))return null;return PL.backup('auto')};
PL.gc=async()=>{const s=PL.getState&&PL.getState();if(!s)return{n:0,size:0};const used=PL.refsIn(s.notes);const bl=await PL.listBackups();for(const b of bl){try{const d=await PL.getBackup(b.id);PL.refsIn(d.notes).forEach(x=>used.add(x))}catch(e){}}let n=0,size=0;for(const id of await PL.blobKeys()){if(!used.has(id)){const b=await PL.getBlob(id);size+=b&&b.size||0;await PL.delBlob(id);delete OBJ[id];n++}}return{n,size}};
PL.estimate=async()=>{try{return navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():null}catch(e){return null}};
PL.persist=async()=>{try{return navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false}catch(e){return false}};

/* ---------- Claude (direct from this device) ---------- */
const friendly=(e,what)=>{if(e&&e.name==='TypeError')return'Can’t reach '+what+' — you may be offline';return e&&e.message||'Something went wrong'};
PL.sample=async(messages,o)=>{o=o||{};const key=PL.cfg.claudeKey;if(!key)throw new Error('Add your Claude API key in Settings');
 const tools=(o.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));const byName={};(o.tools||[]).forEach(t=>byName[t.name]=t);
 const m=messages.map(x=>({role:x.role,content:x.content}));let text='';
 const sys='You are Claude inside the user’s Second Brain notes app. Use the tools to read and change their notes when asked. Keep replies short and plain.';
 for(let turn=0;turn<8;turn++){
  let r,j;for(let tries=0;tries<2;tries++){
   try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:PL.cfg.model||'claude-sonnet-5-5',max_tokens:2048,system:sys,messages:m,tools:tools.length?tools:undefined})})}catch(e){throw new Error(friendly(e,'Anthropic'))}
   j=await r.json().catch(()=>({}));if((r.status===429||r.status===529)&&tries===0){await new Promise(z=>setTimeout(z,2200));continue}break}
  if(!r.ok){const msg=(j.error&&j.error.message)||('HTTP '+r.status);throw new Error(r.status===401?'That Claude API key was rejected — check it in Settings':msg)}
  m.push({role:'assistant',content:j.content});const part=j.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');if(part)text+=(text?'\n\n':'')+part;o.onText&&o.onText({text});
  const uses=j.content.filter(b=>b.type==='tool_use');if(j.stop_reason!=='tool_use'||!uses.length)break;
  const res=[];for(const b of uses){let out;const t=byName[b.name];try{out=t?await t.execute(b.input||{}):{error:'Unknown tool'}}catch(e){out={error:String(e&&e.message||e)}}res.push({type:'tool_result',tool_use_id:b.id,content:typeof out==='string'?out:JSON.stringify(out)})}
  m.push({role:'user',content:res})}
 return{text}};
PL.testClaude=async()=>{const r=await PL.sample([{role:'user',content:'Reply with the single word: ready'}],{});return r.text};

/* ---------- Firebase (Auth + Firestore over REST; polls for changes) ---------- */
const FB=PL.FB={tok:null,exp:0,uid:null,ref:null,email:''};
{const a=rd(AK,null);if(a&&a.email===PL.cfg.fb.email){FB.tok=a.tok;FB.exp=a.exp;FB.uid=a.uid;FB.ref=a.ref;FB.email=a.email}}
const fbMsg=m=>{m=String(m||'');if(/EMAIL_NOT_FOUND/.test(m))return'No account with that email yet — use “Create account”';if(/INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS/.test(m))return'Wrong email or password';if(/EMAIL_EXISTS/.test(m))return'That email already has an account — use Connect';if(/WEAK_PASSWORD/.test(m))return'Password needs at least 6 characters';if(/API_KEY_INVALID|API key not valid/i.test(m))return'That Firebase API key isn’t valid';if(/OPERATION_NOT_ALLOWED/.test(m))return'Turn on Email/Password sign-in in Firebase Authentication';if(/TOO_MANY_ATTEMPTS/.test(m))return'Too many attempts — wait a minute';return m};
const fbSave=()=>wr(AK,{tok:FB.tok,exp:FB.exp,uid:FB.uid,ref:FB.ref,email:PL.cfg.fb.email});
FB.signIn=async create=>{const c=PL.cfg.fb;let r,j;try{r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+(create?'signUp':'signInWithPassword')+'?key='+encodeURIComponent(c.apiKey),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:c.email,password:c.password,returnSecureToken:true})})}catch(e){throw new Error(friendly(e,'Firebase'))}
 j=await r.json().catch(()=>({}));if(!r.ok){const m=j.error&&j.error.message||('HTTP '+r.status);const e=new Error(fbMsg(m));e.code=m;throw e}
 FB.tok=j.idToken;FB.exp=Date.now()+(+j.expiresIn||3600)*1000;FB.uid=j.localId;FB.ref=j.refreshToken;fbSave();return FB.tok};

const chip=x=>`<span class="chip" data-o="${x.id}"><i class="dot" style="background:${colorOf(x)}"></i>${esc(x.t||'Untitled')}</span>`;
const clip=(text,title)=>{

 if(i<0)i=Math.max(0,t.toLowerCase().indexOf((title||'').toLowerCase()));

 return esc(t).replace(/\[\[([^\]]+?)\]\]/g,(m,x)=>{const p=parseL(dec(x));return p.t.toLowerCase()===(title||'').trim().toLowerCase()?'<mark>'+esc(p.alias||p.t)+'</mark>':esc(p.alias||p.t)})};
function mentions(n){
 const t=(n.t||'').trim();if(t.length<3)return[];const lt=t.toLowerCase(),out=[],linked=new Set((getLX().inn[n.id]||[]).map(x=>x.from));

  const lb=o.b.toLowerCase();let i=lb.indexOf(lt);while(i>=0){const before=o.b.lastIndexOf('[[',i),after=o.b.indexOf(']]',i);const inside=before>=0&&after>=0&&o.b.indexOf(']]',before)>=i&&!/\n/.test(o.b.slice(before,i));

(function(){

 sheet._items=items;sheet.hidden=false};

$('#shl').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const it=sheet._items[+b.dataset.i];closeSheet();vib(5);if(it&&it.fn)setTimeout(it.fn,120)});
$('#shb').addEventListener('click',closeSheet);
{let y0=null;$('#shp').addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});$('#shp').addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>60)closeSheet();y0=null},{passive:true})}
window.noteSheet=function(id){

 const it=[];

 else it.push({label:ro?'Edit this note':'Switch to reading',fn:()=>setRO(!ro)});

/* bottom bar */
const only=k=>{if(k!=='side'&&!$('#side').hidden)$('#side').hidden=true;if(k!=='ai'&&!$('#ai').hidden)$('#aix').click();if(!$('#set').hidden)$('#set').hidden=true};
function cycleView(){

 toast(['Graph','Colony','Sphere'][nxt]);setTimeout(updateBn,60)}

 else if(k==='new'){only('');newNote(null)}

 else if(k==='ai'){only('ai');$('#aib').click()}
 else if(k==='back'){back()}
 else if(k==='rw'){setRO(!ro)}
 else if(k==='sub'){if(sel)newNote(sel)}

/* canvas gestures: long press, double tap, two-finger pan */
cv.addEventListener('contextmenu',e=>e.preventDefault());
let lp=null,lx=0,ly=0,tapT=0,tapX=0,tapY=0,pm=null;
cv.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse')return;
 if(ptr.size>1){clearTimeout(lp);lp=null;if(ptr.size===2){const v=[...ptr.values()];pm=[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2]}return}
 lx=e.clientX;ly=e.clientY;clearTimeout(lp);
 lp=setTimeout(()=>{lp=null;if(ptr.size!==1||moved>8)return;moved=99;vib(14);const id=hit(lx,ly);if(id){setCur(id);noteSheet(id)}else bgSheet()},480)});
cv.addEventListener('pointermove',e=>{
 if(lp&&Math.hypot(e.clientX-lx,e.clientY-ly)>9){clearTimeout(lp);lp=null}
 if(ptr.size===2){const v=[...ptr.values()],mx=(v[0][0]+v[1][0])/2,my=(v[0][1]+v[1][1])/2;if(pm&&mode==='graph'){cam.x+=mx-pm[0];cam.y+=my-pm[1];need=1}pm=[mx,my]}else pm=null});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{clearTimeout(lp);lp=null;if(ptr.size<2)pm=null;
 if(t!=='pointerup'||e.pointerType==='mouse'||moved>=6)return;
 if(hit(e.clientX,e.clientY)){tapT=0;return}
 const now2=performance.now();
 if(now2-tapT<330&&Math.hypot(e.clientX-tapX,e.clientY-tapY)<30){tapT=0;vib(6);
  if(mode==='graph'){const k2=Math.min(6,cam.k*1.9),r=k2/cam.k,x=e.clientX,y=e.clientY;tg={x:(x-W/2)-(x-W/2-cam.x)*r,y:(y-H/2)-(y-H/2-cam.y)*r,k:k2}}
  else{zoom3=Math.min(3,zoom3*1.6);need=1}}
 else{tapT=now2;tapX=e.clientX;tapY=e.clientY}}));

/* swipes: from the left edge = back; sideways on a note = neighbouring note; panels swipe away */
let ts=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1){ts=null;return}const t=e.touches[0];ts={x:t.clientX,y:t.clientY,t:Date.now(),el:e.target}},{passive:true});
document.addEventListener('touchend',e=>{
 if(!ts)return;const t=e.changedTouches[0],dx=t.clientX-ts.x,dy=t.clientY-ts.y,s=ts;ts=null;
 if(Date.now()-s.t>650||Math.abs(dy)>70)return;
 const el=s.el&&s.el.closest?s.el:null;
 if(s.x<24&&dx>80){if(back())vib(6);return}
 if(el&&el.closest('#side')&&dx<-90&&!el.closest('input,textarea')){$('#side').hidden=true;return}
 if(el&&el.closest('#ai,#set')&&dx>110&&!el.closest('input,textarea,pre')){if(!$('#set').hidden)$('#set').hidden=true;else $('#aix').click();return}
 if(!$('#ed').hidden&&sel&&ro&&el&&el.closest('#ed')&&Math.abs(dx)>110&&Math.abs(dy)<50&&!el.closest('input,textarea,pre,#bnav,#rel button')){vib(8);hop(dx<0?1:-1)}
},{passive:true});
SHORT.push(['Touch','Long-press a note for actions · double-tap empty space to zoom · swipe from the left edge to go back · swipe a note sideways for the next one']);
})();

<script>
/* ===== v4: spatial grid, simulate only what is visible, culled drawing ===== */
(function(){
class Grid{
 constructor(c){this.c=c;this.m=new Map()}
 clear(){this.m.clear()}
 add(o){const k=(Math.floor(o.x/this.c)+32768)*65536+(Math.floor(o.y/this.c)+32768);let a=this.m.get(k);if(!a)this.m.set(k,a=[]);a.push(o)}
 near(x,y,r,fn){const c=this.c,x0=Math.floor((x-r)/c),x1=Math.floor((x+r)/c),y0=Math.floor((y-r)/c),y1=Math.floor((y+r)/c);
  for(let i=x0;i<=x1;i++)for(let j=y0;j<=y1;j++){const a=this.m.get((i+32768)*65536+(j+32768));if(a)for(let t=0;t<a.length;t++)fn(a[t])}}
}
window.Grid=Grid;
const GR=new Grid(200);let FULL=false,LKsrc=null,LKA={};
function lkAdj(){if(LKsrc!==LINK){LKsrc=LINK;LKA={};LINK.forEach(([a,b])=>{(LKA[a]=LKA[a]||[]).push(b);(LKA[b]=LKA[b]||[]).push(a)})}return LKA}
/* which nodes move this step, and which nodes they need to see */
function region(){
 const n=N.length,m=PL.cfg.sim;PL.stats.total=n;
 if(m==='off'||FULL||(m==='auto'&&n<=300)){PL.stats.active=n;return[N,N]}
 const mg=Math.max(260,Math.max(W,H)*.6)/cam.k,x0=(-cam.x-W/2)/cam.k-mg,x1=(W/2-cam.x)/cam.k+mg,y0=(-cam.y-H/2)/cam.k-mg,y1=(H/2-cam.y)/cam.k+mg,pad=260,act=[],reg=[];
 for(let i=0;i<n;i++){const a=N[i];
  if(a.x>x0&&a.x<x1&&a.y>y0&&a.y<y1){act.push(a);reg.push(a)}
  else if(a.x>x0-pad&&a.x<x1+pad&&a.y>y0-pad&&a.y<y1+pad)reg.push(a)}
 PL.stats.active=act.length;return[act,reg]}
function load(reg){GR.clear();for(const a of reg){if(!isFinite(a.x)||!isFinite(a.y)){a.x=(Math.random()-.5)*300;a.y=(Math.random()-.5)*300;a.vx=a.vy=0}GR.add(a)}}
/* constellation layout */
function stepCon(){
 const t0=performance.now(),[act,reg]=region();GR.c=200;load(reg);const lk=lkAdj(),M=GR.m;
 for(const a of act){
  const o=S.notes[a.id];let fx=-a.x*.002,fy=-a.y*.002;
  const gx=Math.floor(a.x/200)+32768,gy=Math.floor(a.y/200)+32768;
  for(let i=gx-1;i<=gx+1;i++)for(let j=gy-1;j<=gy+1;j++){const arr=M.get(i*65536+j);if(!arr)continue;for(let t=0,n=arr.length;t<n;t++){const b=arr[t];if(b===a)continue;const dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy+.1;if(d<40000){const f=900/d*alpha;fx+=dx*f;fy+=dy*f}}}
  if(o&&o.p&&NM[o.p]){const p=NM[o.p],dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-55)/d*.08*alpha;fx+=dx*f;fy+=dy*f}
  const ch=CH[a.id];if(ch)for(const c of ch){const b=NM[c.id];if(!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-55)/d*.08*alpha;fx+=dx*f;fy+=dy*f}
  const L=lk[a.id];if(L)for(const id of L){const b=NM[id];if(!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-130)/d*.01*alpha;fx+=dx*f;fy+=dy*f}
  a.vx+=fx;a.vy+=fy}
 for(const a of act){a.x+=a.vx*=.8;a.y+=a.vy*=.8}
 alpha*=.982;PL.stats.ms=performance.now()-t0}
/* colony layout */
function stepColony(){
 const t0=performance.now();if(!N.length)return;if(N.some(a=>!CLU[a.id]))orgPrep();
 const cen={};for(const a of N){const c=CLU[a.id],o=cen[c]||(cen[c]={x:0,y:0,n:0});o.x+=a.x;o.y+=a.y;o.n++}
 const[act,reg]=region();GR.c=250;load(reg);const lk=lkAdj(),M=GR.m;
 for(const a of act){
  const ca=CLU[a.id];let fx=-a.x*.0022,fy=-a.y*.0022;
  const gx=Math.floor(a.x/250)+32768,gy=Math.floor(a.y/250)+32768;
  for(let i=gx-1;i<=gx+1;i++)for(let j=gy-1;j<=gy+1;j++){const arr=M.get(i*65536+j);if(!arr)continue;for(let t=0,n=arr.length;t<n;t++){const b=arr[t];if(b===a)continue;const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.1,same=ca===CLU[b.id];if(d2<(same?5000:62500)){const f=(same?160:380)/d2;fx+=dx*f;fy+=dy*f}}}
  const o=S.notes[a.id],p=o&&o.p&&NM[o.p];
  if(p){const dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy)||1,L=24+Math.min(14,(CH[o.p]||[]).length*1.5),f=(d-L)/d*.14;fx+=dx*f;fy+=dy*f}
  const ch=CH[a.id];if(ch&&ch.length){const L=24+Math.min(14,ch.length*1.5);for(const c of ch){const b=NM[c.id];if(!b)continue;const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,f=(d-L)/d*.14;fx-=dx*f*.3;fy-=dy*f*.3}}
  const c=cen[ca];if(c){fx+=(c.x/c.n-a.x)*.008;fy+=(c.y/c.n-a.y)*.008}
  fx+=(Math.random()-.5)*.5*alpha;fy+=(Math.random()-.5)*.5*alpha;
  const L=lk[a.id];if(L)for(const id of L){const b=NM[id];if(!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-160)/d*.004;fx+=dx*f;fy+=dy*f}
  a.vx+=fx;a.vy+=fy}
 for(const a of act){a.x+=a.vx*=.82;a.y+=a.vy*=.82}
 alpha*=.982;PL.stats.ms=performance.now()-t0}
window.stepCon=stepCon;window.stepColony=stepColony;
step=function(){ORG?stepColony():stepCon()};
stepOrg=stepColony;
/* the first layout of a freshly loaded map runs on everything; live settling afterwards only touches the screen */
const _pw=prewarm;prewarm=function(k){FULL=true;try{_pw(k)}finally{FULL=false}};
/* tapping a note: look it up in a grid instead of scanning every node */
const HG=new Grid(70);let HGsig='';
const sigOf=()=>{const n=N.length;let s=n+':';for(let i=0;i<n;i+=Math.max(1,Math.floor(n/12))){s+=((N[i].x*10)|0)+','+((N[i].y*10)|0)+';'}return s};
const _hit=hit;
hit=function(x,y){
 if(mode!=='graph'||N.length<=300)return _hit(x,y);
 const sg=sigOf()+cam.k;
 if(sg!==HGsig){HG.clear();for(const a of N)HG.add(a);HGsig=sg}
 const R=26/cam.k,wx=(x-cam.x-W/2)/cam.k,wy=(y-cam.y-H/2)/cam.k;let b=null,bd=1e9;
 HG.near(wx,wy,R+8,a=>{const q=pos(a.id),d=Math.hypot(q.x-x,q.y-y);if(d<rad(a.id)+8&&d<bd){bd=d;b=a.id}});
 return b};
window.hitSlow=_hit;
})();

</script>
